buildscript {
    ext.kotlin_version = '1.9.22'  // Updated to support JVM target 21
    repositories {
        google()
        gradlePluginPortal()
        mavenCentral()  // Added for better dependency resolution
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.4'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()  // Added for plugin dependencies
        maven { url 'https://jitpack.io' }  // Fallback repository
    }
}

rootProject.buildDir = '../build'

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}