group 'me.schlaubi.fluttercontactpicker'
version '4.7.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '1.9.22'  // Updated from 1.6.21
    repositories {
        google()
        gradlePluginPortal()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.4'  // Updated from 7.0.4
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()  // Added this
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'de.mintware.flutter_contact_picker'  // Fixed namespace
    compileSdkVersion 35

    defaultConfig {
        targetSdkVersion 35
        minSdkVersion 21
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lintOptions {
        disable 'InvalidPackage'
    }
}